{% extends 'base.html' %}

{% block title %}Greeting Page{% endblock %}

{% block content %}
<div class="resume-container d-flex">
    <nav class="nav flex-column me-4 border-end pe-4">
        <a class="nav-link" href="{{ url_for('users.greetings', name='John') }}">Greet John</a>
        <a class="nav-link" href="{{ url_for('users.admin') }}">Admin Panel</a>
    </nav>

    <div>
        <h2>Hello, {{ name }}!</h2>
        {% if age %}
            <p>You are {{ age }} years old.</p>
        {% else %}
            <p>Your age is unknown.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
